<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOREVER MACRO CREATOR</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="wow-addon-frame">
        <!-- Cabeçalho -->
        <header class="wow-header">
            <div class="addon-title-group">
                <img src="https://worldofwarcraft.com" class="header-logo" alt="WoW Logo">
                <h1 class="addon-title">FOREVER MACRO CREATOR <span class="sub-nav">SEARCH • SELECT • INSERT</span></h1>
            </div>
            <div class="wow-header-right">
                <div class="auto-status">AUTO: ON</div>
                <button class="close-btn">×</button>
            </div>
        </header>

        <!-- Barra de Busca e Controle -->
        <div class="search-bar-row">
            <div class="search-box-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="skillSearch" placeholder="Procure por habilidades..." readonly>
            </div>
            <button class="wow-btn-clear" id="btnClearMacro">CLEAR</button>
        </div>

        <!-- Grade de Três Colunas -->
        <main class="wow-main-layout">
            
            <!-- Coluna 1: Classes -->
            <section class="wow-column column-borders">
                <h2 class="col-title">CLASSES</h2>
                <div class="button-list">
                    <button class="class-btn cls-warrior" data-class="WARRIOR">WARRIOR</button>
                    <button class="class-btn cls-paladin" data-class="PALADIN">PALADIN</button>
                    <button class="class-btn cls-hunter" data-class="HUNTER">HUNTER</button>
                    <button class="class-btn cls-rogue" data-class="ROGUE">ROGUE</button>
                    <button class="class-btn cls-priest" data-class="PRIEST">PRIEST</button>
                    <button class="class-btn cls-shaman" data-class="SHAMAN">SHAMAN</button>
                    <button class="class-btn cls-mage" data-class="MAGE">MAGE</button>
                    <button class="class-btn cls-warlock" data-class="WARLOCK">WARLOCK</button>
                    <button class="class-btn cls-druid" data-class="DRUID">DRUID</button>
                    <button class="class-btn cls-consumables" data-class="CONSUMABLES">CONSUMABLES</button>
                </div>
            </section>

            <!-- Coluna 2: Categorias -->
            <section class="wow-column column-borders">
                <h2 class="col-title">CATEGORIES</h2>
                <div class="button-list" id="categoriesGroup">
                    <button class="category-btn active" data-cat="all">All Macros</button>
                    <button class="category-btn" data-cat="abilities">Abilities</button>
                    <button class="category-btn" data-cat="buffs">Buffs</button>
                    <button class="category-btn" data-cat="control">Control</button>
                    <button class="category-btn" data-cat="defensives">Defensives</button>
                    <button class="category-btn" data-cat="learned">Learned Abilities</button>
                    <button class="category-btn" data-cat="other">Other Items</button>
                    <button class="category-btn" data-cat="pet">Pet</button>
                    <button class="category-btn" data-cat="potions">Potions</button>
                    <button class="category-btn" data-cat="ranged">Ranged Attacks</button>
                    <button class="category-btn" data-cat="targeting">Targeting</button>
                    <button class="category-btn" data-cat="utility">Utility</button>
                </div>
            </section>

            <!-- Coluna 3: Lista de Encontros e Editor -->
            <section class="wow-column main-content-col">
                <div class="library-header">
                    <h2 class="col-title">MACRO LIBRARY</h2>
                    <span class="found-counter" id="itemsFoundCounter">0 FOUND</span>
                </div>
                
                <!-- Lista de Habilidades Dinâmicas -->
                <div class="macro-library-list" id="skillsGroup">
                    <div class="empty-notice">Selecione uma classe à esquerda...</div>
                </div>

                <!-- Painel Inferior de Código Construído -->
                <div class="macro-builder-bottom-panel">
                    <div class="macro-meta-info">
                        <span class="current-macro-name" id="currentMacroName">Selecione uma skill</span>
                        <div class="char-counter"><span id="charCount">0</span> / 255</div>
                    </div>

                    <div class="output-container">
                        <textarea id="macroOutput" readonly placeholder="#showtooltip\nMonte sua sequência clicando nos cards acima..."></textarea>
                        <div class="output-side-indicators">
                            <div class="indicator-box">🗚</div>
                            <div class="indicator-box">🗛</div>
                        </div>
                    </div>

                    <div class="wow-action-row">
                        <button class="wow-btn-addon" id="btnCopy">SELECT CODE</button>
                        <button class="wow-btn-addon" id="btnInsertBlizzard">INSERT INTO BLIZZARD</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
